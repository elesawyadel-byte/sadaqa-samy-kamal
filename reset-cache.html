<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث الموقع</title><style>body{font-family:Arial,sans-serif;background:#071711;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:620px;padding:32px;border:1px solid #315747;border-radius:20px;background:#0d251c;text-align:center}button{padding:14px 24px;border:0;border-radius:12px;background:#e9bf5e;font-weight:700;cursor:pointer}small{display:block;margin-top:16px;color:#b7c9c1}</style></head><body><div class="box"><h1>تحديث ملفات موقع الصدقة الجارية</h1><p id="msg">اضغط الزر لمسح النسخ القديمة المحفوظة ثم فتح أحدث إصدار.</p><button id="reset">مسح الكاش وفتح الموقع</button><small>هذه العملية لا تمسح المفضلة أو عدادات الأذكار أو تقدم الختمة من localStorage.</small></div><script>
document.getElementById('reset').onclick=async()=>{const m=document.getElementById('msg');m.textContent='جارٍ تنظيف الملفات القديمة...';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}m.textContent='تم التنظيف. جارٍ فتح الموقع...';setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),500);}catch(e){m.textContent='تمت المحاولة. افتح الموقع الآن.';setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),700)}};
</script></body></html>
